name: Build ImmortalWrt 25.12.2 for GL-MT3000

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub Release after a successful build"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: mt3000-firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd xz-utils curl ca-certificates coreutils

      - name: Build firmware with official ImageBuilder
        env:
          IMAGEBUILDER_SHA256: e6af4f8c5db66e52c4bd5e2b629f8a617d61c6ebc94dc8c52754fa143cb4ac9a
          IMAGEBUILDER_URL: https://downloads.immortalwrt.org/releases/25.12.2/targets/mediatek/filogic/immortalwrt-imagebuilder-25.12.2-mediatek-filogic.Linux-x86_64.tar.zst
        run: |
          chmod +x ./mediatek-filogic/build.sh
          ./mediatek-filogic/build.sh

      - name: Generate checksums and build information
        run: |
          cd bin/targets/mediatek/filogic
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cp "$GITHUB_WORKSPACE/mediatek-filogic/info.md" BUILD-INFO.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-GL-MT3000-25.12.2
          path: bin/targets/mediatek/filogic/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ inputs.release }}
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: GL-MT3000-25.12.2-${{ github.run_number }}
          name: GL-MT3000 ImmortalWrt 25.12.2 build ${{ github.run_number }}
          body_path: mediatek-filogic/info.md
          files: |
            bin/targets/mediatek/filogic/*gl-mt3000*
            bin/targets/mediatek/filogic/SHA256SUMS
            bin/targets/mediatek/filogic/BUILD-INFO.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
